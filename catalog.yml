# Single source of truth for notebook categories, titles, and website posts.
# The README "Notebooks" section is generated from this file:
#   python scripts/build_index.py
#
# Notebook filenames are prefixed with their category key (e.g. imaging_pulse_sar.ipynb).

categories:
  waveform:
    name: Radar Waveforms
    site_slug: radar-systems-waveforms
    description: Waveform design and the processing chain that goes with it.
  mimo:
    name: MIMO & Array Processing
    site_slug: mimo-multi-channel-systems
    description: Multi-channel radars, virtual arrays, and direction-of-arrival estimation.
  imaging:
    name: Radar Imaging (SAR & MIMO)
    site_slug: radar-imaging
    description: Forming radar images with synthetic apertures and MIMO arrays.
  scene:
    name: 3D Scenes & Ray Tracing
    site_slug: 3d-scene-simulation-ray-tracing
    description: Ray-traced mesh targets, moving platforms, and propagation effects.
  rcs:
    name: Radar Cross Section (RCS)
    site_slug: radar-cross-section-rcs-analysis
    description: Monostatic, bistatic, and polarimetric RCS of mesh targets.
  detection:
    name: Detection & Link Budget
    site_slug: signal-processing-detection
    description: Detection theory, CFAR, and end-to-end SNR analysis.
  impairment:
    name: Impairments & Interference
    site_slug: impairments-interference
    description: Hardware non-idealities and mutual interference.
  lidar:
    name: LiDAR Simulation
    site_slug: lidar-simulation
    description: Ray-traced LiDAR point clouds.

